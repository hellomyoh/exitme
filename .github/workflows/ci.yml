name: ci

on:
  push:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: stocklab
          POSTGRES_PASSWORD: stocklab-dev-password
          POSTGRES_DB: stocklab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stocklab -d stocklab"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://stocklab:stocklab-dev-password@localhost:5432/stocklab
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: Migrate
        working-directory: apps/api
        run: alembic upgrade head
      - name: Pytest
        working-directory: apps/api
        run: pytest -v

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: apps/web
        run: |
          npm install
          npm run build

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
          docker compose config -q
