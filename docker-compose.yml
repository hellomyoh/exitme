services:
  nginx:
    image: nginx:alpine
    ports:
      - "12010:12010"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:12010/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: ./apps/web
    environment:
      - API_INTERNAL_URL=http://api:8000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./apps/api
    image: stocklab-api    # api/worker/scheduler 가 동일 이미지 공유 (개별 stale 이미지 방지, NOTES.md)
    env_file: .env
    environment:
      - SERVICE_ROLE=api
      # 선택: 지정하면 app/VERSION 파일 대신 이 값을 /health 에 표시 (기본은 파일 + 이미지 빌드 시각)
      - APP_VERSION=${APP_VERSION:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: stocklab-api
    pull_policy: never   # 로컬 빌드 태그 전용 — 레지스트리 pull 금지 (2026-09-01 원격 배포 결함)
    env_file: .env
    environment:
      - SERVICE_ROLE=worker
    command: celery -A app.worker.celery_app worker -Q backtest,ingest --concurrency=4 --loglevel=INFO
    healthcheck:
      # 워커 자체 응답 + beat→큐→워커 하트비트(Redis 키, 60초 주기·TTL 180초, ADR-009 §5) — 큐가 소비되지 않으면 unhealthy
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --timeout 5 >/dev/null && python -c \"import redis,os,sys;r=redis.from_url(os.environ.get('REDIS_URL','redis://redis:6379/0'));sys.exit(0 if r.get('autoexec:pipeline:heartbeat') else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 150s   # 첫 하트비트(60초 주기)가 찍힐 때까지 유예
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    image: stocklab-api
    pull_policy: never   # 로컬 빌드 태그 전용 — 레지스트리 pull 금지 (2026-09-01 원격 배포 결함)
    env_file: .env
    environment:
      - SERVICE_ROLE=scheduler
    # -s: 상태 파일을 코드 디렉터리 밖에 둔다 — 작업 디렉터리의 celerybeat-schedule(바인드 마운트·이미지 혼입)을 읽지 않게 (2026-09-09 사고).
    #     컨테이너 파일시스템에 남으므로 restart 뒤 짧은 공백의 크론은 따라잡고, 1시간 넘게 지난 것은 beat_cron_starting_deadline 이 건너뛴다
    command: celery -A app.worker.celery_app beat --loglevel=INFO -s /var/lib/celery/celerybeat-schedule
    healthcheck:
      # beat 가 실제로 태스크를 보내고 워커가 받았는지 — 하트비트 키(ADR-009 §5). 종전(모듈 import 만)은 2026-09-08 미실행을 잡지 못했다
      test: ["CMD", "python", "-c", "import redis,os,sys;r=redis.from_url(os.environ.get('REDIS_URL','redis://redis:6379/0'));sys.exit(0 if r.get('autoexec:pipeline:heartbeat') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 150s
    depends_on:
      redis:
        condition: service_healthy

  db:
    image: timescale/timescaledb-ha:pg16
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-stocklab}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-stocklab-dev-password}
      - POSTGRES_DB=${POSTGRES_DB:-stocklab}
    volumes:
      - pgdata:/home/postgres/pgdata/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stocklab} -d ${POSTGRES_DB:-stocklab}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
