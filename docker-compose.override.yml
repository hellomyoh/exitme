# 개발용 override (기본 적용): 소스 bind mount + hot reload
services:
  api:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./apps/api:/srv/app

  worker:
    volumes:
      - ./apps/api:/srv/app

  scheduler:
    volumes:
      - ./apps/api:/srv/app

  web:
    command: npm run dev
    environment:
      # Windows bind mount 는 파일 변경 이벤트를 전달하지 못함 → 폴링 감시 (NOTES.md)
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./apps/web:/srv/web
      - /srv/web/node_modules
      - /srv/web/.next
